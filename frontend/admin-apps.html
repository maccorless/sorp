<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Management - SARP Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>SARP App Management</h1>
            <p>Configure maximum sessions and settings for each application</p>
        </div>

        <div class="admin-table-container">
            <h2 style="margin-bottom: 1.5rem; color: var(--text-primary); font-size: 1.25rem;">Application Settings</h2>

            <table>
                <thead>
                    <tr>
                        <th>App Code</th>
                        <th>App Name</th>
                        <th>Max Sessions</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="apps-table">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                            <div class="loading" style="margin: 0 auto 1rem;"></div>
                            Loading app data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 2rem; text-align: center; display: flex; gap: 1rem; justify-content: center;">
            <button onclick="window.location.href='/frontend/admin.html'" class="btn btn-secondary">
                ← Back to Users
            </button>
            <button onclick="window.location.href='/'" class="btn btn-secondary">
                ← Back to Login
            </button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 16px; padding: 2.5rem; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);">
            <h2 style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.5rem;">Edit App Settings</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                Configure maximum session limit for <strong id="edit-app-name"></strong>
            </p>

            <div class="form-group">
                <label for="max-sessions">Maximum Sessions</label>
                <input type="number" id="max-sessions" min="1" max="100" style="width: 100%; padding: 0.875rem 1rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1rem;">
            </div>

            <div id="edit-error" style="display: none; background: #FEE; color: #C33; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem;"></div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button id="save-btn" class="btn" style="flex: 1;">Save Changes</button>
                <button id="cancel-btn" class="btn btn-secondary" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentEditApp = null;

        async function loadApps() {
            try {
                const response = await fetch(`${API_BASE}/admin/apps`);
                const data = await response.json();
                displayApps(data.apps);
            } catch (error) {
                console.error('Failed to load apps:', error);
                document.getElementById('apps-table').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 3rem; color: var(--error);">
                            <strong>Failed to load data</strong><br>
                            <span style="font-size: 0.875rem;">Please check if the server is running</span>
                        </td>
                    </tr>
                `;
            }
        }

        function displayApps(apps) {
            const tbody = document.getElementById('apps-table');

            if (apps.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                            <strong>No apps configured</strong>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = apps.map(app => {
                const statusBadge = app.active
                    ? `<span style="background: var(--success); color: white; padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;">Active</span>`
                    : `<span style="background: var(--text-light); color: white; padding: 0.25rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;">Inactive</span>`;

                return `
                    <tr>
                        <td><code>${app.app_code}</code></td>
                        <td><strong>${app.app_name}</strong></td>
                        <td style="text-align: center; font-size: 1.25rem; font-weight: 600;">${app.max_sessions}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button onclick="editApp(${app.id}, '${app.app_name}', ${app.max_sessions})" class="btn btn-secondary btn-small" style="padding: 0.375rem 0.75rem; font-size: 0.8125rem;">
                                Edit
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function editApp(appId, appName, maxSessions) {
            currentEditApp = appId;
            document.getElementById('edit-app-name').textContent = appName;
            document.getElementById('max-sessions').value = maxSessions;
            document.getElementById('edit-modal').style.display = 'flex';
            document.getElementById('edit-error').style.display = 'none';
        }

        async function saveAppSettings() {
            const maxSessions = document.getElementById('max-sessions').value;
            const errorDiv = document.getElementById('edit-error');

            if (!maxSessions || maxSessions < 1) {
                errorDiv.textContent = 'Please enter a valid number (minimum 1)';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/apps/${currentEditApp}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_sessions: parseInt(maxSessions) })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('edit-modal').style.display = 'none';
                    loadApps(); // Reload the table
                } else {
                    errorDiv.textContent = data.error || 'Failed to update settings';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                console.error(error);
            }
        }

        // Event listeners
        document.getElementById('save-btn').addEventListener('click', saveAppSettings);
        document.getElementById('cancel-btn').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
        });

        // Load apps on page load
        loadApps();
    </script>
</body>
</html>
